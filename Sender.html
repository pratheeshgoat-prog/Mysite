<!DOCTYPE html>
<html>

<head>
  <title>Sender</title>

  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>

<body>

<h1>Connecting Camera...</h1>

<script>

const peer = new Peer();

navigator.mediaDevices.getUserMedia({
  video: true,
  audio: false
})
.then(stream => {

  const call =
    peer.call("viewer", stream);

});

</script>

</body>
</html>
