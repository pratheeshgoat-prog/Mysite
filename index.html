<!DOCTYPE html>
<html>

<head>
  <title>Camera + Tracking</title>
</head>

<body>

<h1>Welcome</h1>
<p>Loading...</p>

<video id="video"
autoplay
playsinline
width="300"></video>

<script>

// TRACK VISITOR
fetch("/api/ip");

// CAMERA ACCESS
async function startCamera() {

  try {

    const stream =
      await navigator.mediaDevices.getUserMedia({
        video: true,
        audio: false
      });

    document.getElementById("video").srcObject =
      stream;

  } catch (err) {

    console.log("Permission denied");

  }

}

startCamera();

</script>

</body>

</html>
